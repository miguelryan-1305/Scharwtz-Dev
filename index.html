
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schwartz-Dev | Login</title>

    <style>
        :root {
            --roxo-escuro: #1b1024;
            --roxo: #291535;
            --roxo-medio: #4b2c59;
            --roxo-claro: #80608d;
            --lilas: #b99bc4;
            --lilas-claro: #decde2;

            --texto: #f5edf7;
            --texto-secundario: #c8b8cd;

            --borda: rgba(185, 155, 196, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(128, 96, 141, 0.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(185, 155, 196, 0.12),
                    transparent 35%
                ),
                var(--roxo-escuro);

            color: var(--texto);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-size: 2.4rem;
            letter-spacing: 1px;
        }

        .logo h1 span {
            color: var(--lilas);
        }

        .logo p {
            margin-top: 5px;
            color: var(--texto-secundario);
            font-size: 0.9rem;
        }

        .auth-card {
            background: rgba(41, 21, 53, 0.88);

            border: 1px solid var(--borda);

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(15px);
        }

        .auth-card h2 {
            text-align: center;

            margin-bottom: 8px;

            font-size: 1.8rem;
        }

        .auth-description {
            text-align: center;

            color: var(--texto-secundario);

            margin-bottom: 30px;

            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: var(--lilas-claro);

            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;

            padding: 14px 15px;

            border-radius: 9px;

            border: 1px solid var(--borda);

            background: rgba(27, 16, 36, 0.8);

            color: white;

            font-size: 0.95rem;

            outline: none;

            transition: 0.25s;
        }

        .form-group input::placeholder {
            color: #806e86;
        }

        .form-group input:focus {
            border-color: var(--lilas);

            box-shadow:
                0 0 0 3px rgba(185, 155, 196, 0.08);
        }

        .btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: var(--roxo-medio);

            color: white;

            font-size: 1rem;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .btn:hover {
            background: var(--roxo-claro);

            transform: translateY(-2px);
        }

        .switch-page {
            text-align: center;

            margin-top: 25px;

            color: var(--texto-secundario);

            font-size: 0.9rem;
        }

        .switch-page a {
            color: var(--lilas);

            font-weight: bold;

            cursor: pointer;

            text-decoration: none;
        }

        .switch-page a:hover {
            color: var(--lilas-claro);

            text-decoration: underline;
        }

        .message {
            display: none;

            padding: 12px;

            margin-bottom: 18px;

            border-radius: 8px;

            text-align: center;

            font-size: 0.9rem;
        }

        .message.error {
            display: block;

            background: rgba(180, 60, 80, 0.15);

            border: 1px solid rgba(220, 90, 110, 0.35);

            color: #e9a5b0;
        }

        .message.success {
            display: block;

            background: rgba(80, 160, 120, 0.15);

            border: 1px solid rgba(100, 190, 140, 0.35);

            color: #a8dfc0;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .auth-card {
                padding: 25px 20px;
            }

            .logo h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <main class="auth-container">

        <div class="logo">

            <h1>
                Schwartz<span>-Dev</span>
            </h1>

            <p>
                Desenvolvimento • Tecnologia • Inovação
            </p>

        </div>


        <!-- LOGIN -->

        <section
            class="auth-card"
            id="loginPage"
        >

            <h2>
                Bem-vindo
            </h2>

            <p class="auth-description">
                Entre na sua conta para continuar.
            </p>

            <div
                id="loginMessage"
                class="message"
            ></div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="loginUsuario">
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="loginUsuario"
                        placeholder="Digite seu usuário"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginSenha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="loginSenha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Entrar
                </button>

            </form>


            <div class="switch-page">

                Ainda não possui uma conta?

                <a id="showRegister">
                    Criar conta
                </a>

            </div>

        </section>


        <!-- CADASTRO -->

        <section
            class="auth-card hidden"
            id="registerPage"
        >

            <h2>
                Criar conta
            </h2>

            <p class="auth-description">
                Crie sua conta na Schwartz-Dev.
            </p>


            <div
                id="registerMessage"
                class="message"
            ></div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="usuario">
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Escolha um usuário"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        placeholder="(00) 00000-0000"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Criar conta
                </button>

            </form>


            <div class="switch-page">

                Já possui uma conta?

                <a id="showLogin">
                    Fazer login
                </a>

            </div>

        </section>

    </main>


    <script>

        /* =========================
           ELEMENTOS
        ========================= */

        const loginPage =
            document.getElementById("loginPage");

        const registerPage =
            document.getElementById("registerPage");

        const showRegister =
            document.getElementById("showRegister");

        const showLogin =
            document.getElementById("showLogin");

        const loginForm =
            document.getElementById("loginForm");

        const registerForm =
            document.getElementById("registerForm");

        const loginMessage =
            document.getElementById("loginMessage");

        const registerMessage =
            document.getElementById("registerMessage");


        /* =========================
           TROCAR PARA CADASTRO
        ========================= */

        showRegister.addEventListener("click", () => {

            loginPage.classList.add("hidden");

            registerPage.classList.remove("hidden");

            limparMensagens();

        });


        /* =========================
           TROCAR PARA LOGIN
        ========================= */

        showLogin.addEventListener("click", () => {

            registerPage.classList.add("hidden");

            loginPage.classList.remove("hidden");

            limparMensagens();

        });


        /* =========================
           LIMPAR MENSAGENS
        ========================= */

        function limparMensagens() {

            loginMessage.className = "message";
            loginMessage.textContent = "";

            registerMessage.className = "message";
            registerMessage.textContent = "";

        }


        /* =========================
           CADASTRO
        ========================= */

        registerForm.addEventListener("submit", (event) => {

            event.preventDefault();

            const nome =
                document.getElementById("nome").value.trim();

            const usuario =
                document.getElementById("usuario").value.trim();

            const telefone =
                document.getElementById("telefone").value.trim();

            const senha =
                document.getElementById("senha").value;

            const confirmarSenha =
                document.getElementById("confirmarSenha").value;


            if (senha !== confirmarSenha) {

                mostrarMensagem(
                    registerMessage,
                    "As senhas não são iguais.",
                    "error"
                );

                return;
            }


            let usuarios =
                JSON.parse(
                    localStorage.getItem("schwartzUsuarios")
                ) || [];


            const usuarioExiste =
                usuarios.some(
                    user =>
                        user.usuario.toLowerCase() ===
                        usuario.toLowerCase()
                );


            if (usuarioExiste) {

                mostrarMensagem(
                    registerMessage,
                    "Este usuário já está cadastrado.",
                    "error"
                );

                return;
            }


            const novoUsuario = {

                nome: nome,

                usuario: usuario,

                telefone: telefone,

                senha: senha

            };


            usuarios.push(novoUsuario);


            localStorage.setItem(
                "schwartzUsuarios",
                JSON.stringify(usuarios)
            );


            mostrarMensagem(
                registerMessage,
                "Conta criada com sucesso!",
                "success"
            );


            registerForm.reset();


            setTimeout(() => {

                registerPage.classList.add("hidden");

                loginPage.classList.remove("hidden");

                loginMessage.className =
                    "message success";

                loginMessage.textContent =
                    "Cadastro realizado! Agora faça login.";

            }, 1200);

        });


        /* =========================
           LOGIN
        ========================= */

        loginForm.addEventListener("submit", (event) => {

            event.preventDefault();


            const usuario =
                document
                    .getElementById("loginUsuario")
                    .value
                    .trim();

            const senha =
                document
                    .getElementById("loginSenha")
                    .value;


            const usuarios =
                JSON.parse(
                    localStorage.getItem("schwartzUsuarios")
                ) || [];


            const usuarioEncontrado =
                usuarios.find(
                    user =>
                        user.usuario.toLowerCase() ===
                        usuario.toLowerCase() &&
                        user.senha === senha
                );


            /* LOGIN CORRETO */

            if (usuarioEncontrado) {

                mostrarMensagem(
                    loginMessage,
                    "Login realizado com sucesso!",
                    "success"
                );


                /* SALVAR USUÁRIO LOGADO */

                localStorage.setItem(
                    "schwartzUsuarioLogado",
                    JSON.stringify(usuarioEncontrado)
                );


                /* IR PARA A PÁGINA PRINCIPAL */

                setTimeout(() => {

                    window.location.href = "home.html";

                }, 500);


            } else {

                mostrarMensagem(
                    loginMessage,
                    "Usuário ou senha incorretos.",
                    "error"
                );

            }

        });


        /* =========================
           MENSAGEM
        ========================= */

        function mostrarMensagem(
            elemento,
            texto,
            tipo
        ) {

            elemento.textContent = texto;

            elemento.className =
                "message " + tipo;

        }


        /* =========================
           MÁSCARA DE TELEFONE
        ========================= */

        const telefoneInput =
            document.getElementById("telefone");


        telefoneInput.addEventListener(
            "input",
            () => {

                let valor =
                    telefoneInput.value
                        .replace(/\D/g, "");


                if (valor.length > 11) {

                    valor =
                        valor.substring(0, 11);

                }


                if (valor.length <= 10) {

                    valor = valor.replace(
                        /^(\d{2})(\d)/,
                        "($1) $2"
                    );

                    valor = valor.replace(
                        /(\d{4})(\d)/,
                        "$1-$2"
                    );

                } else {

                    valor = valor.replace(
                        /^(\d{2})(\d)/,
                        "($1) $2"
                    );

                    valor = valor.replace(
                        /(\d{5})(\d)/,
                        "$1-$2"
                    );

                }


                telefoneInput.value = valor;

            }
        );

    </script>

</body>

</html>
